# ═══════════════════════════════════════════════════════════════════
# 统一入口 nginx 配置（单端口同源部署 · 推荐形态）
#
# 用途：让「教务系统」与「AI 教学工作台」共用同一个端口（通常是 80 或 443），
#       从而彻底消除端口不一致导致的免登跳转失败问题。
#
#   http://<你的域名或IP>/            → 教务系统（老师日常入口）
#   http://<你的域名或IP>/ai/         → AI 教学工作台
#   http://<你的域名或IP>/api/        → 后端 API（两者共用）
#
# 为什么推荐这种形态（而不是 8080 / 8082 两个端口）：
#   1. 免登跳转无需猜端口 —— 工作台与教务系统同源，跳转地址就是当前地址
#   2. 只需在路由器/防火墙放行 1 个端口，攻击面更小
#   3. 将来上 HTTPS 只配一处，两个前端同时受益
#   4. 不存在「跳到访问者本机 localhost」的可能
#
# 用法：把本文件内容替换 ai-workbench/nginx.conf（或 web 的 nginx.conf），
#       然后 docker compose 重建 web 镜像即可。工作台镜像可退居备用。
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # 上传大小（Excel 导入）
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ── 后端 API（两个前端共用）─────────────────────────────────────
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # AI 生成可能耗时较久（实测约 7 秒，推理型模型更久）
        proxy_read_timeout 120s;
    }

    # ── 用户上传的资产（Logo / 图标）─────────────────────────────────
    # 文件实体在后端容器的 /app/data/assets（bind mount 到宿主机 server/data/assets），
    # nginx 自己的 docroot 里没有，**必须反代到后端**。
    #
    # ★ 必须用 `^~` 前缀 location：`^~` 表示「命中前缀后不再尝试正则 location」。
    #   否则会被下面 `\.(js|css|png|...)$` 的正则抢走 —— 而那里是
    #   `try_files $uri =404`，在 nginx docroot 找不到文件 → 一律 404。
    #   nginx 规则：**正则 location 优先级高于普通前缀 location**（同 2026-09-20 记录的坑①）。
    #   ★ 同理，`location /ai/` 用 `^~` 更稳妥，避免 /ai/xxx.png 被抢走。
    #
    # 症状（2026-09-21 实测）：上传成功、DB 里路径也对、经 3000 端口能下载，
    #   但通过 nginx 访问 `/assets/site/xxx.png` 返回 404 → 登录页与侧边栏 Logo **裂图**。
    location ^~ /assets/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文件名带时间戳 + 随机串，每次上传都是新 URL，可放心长缓存
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── AI 教学工作台（挂在 /ai/ 子路径下）───────────────────────────
    # 工作台构建产物 base = "./"，使用相对路径资源，可安全挂在子路径。
    # hash 路由（#/...）不参与服务端路由，因此只需把 /ai/ 静态托管即可。
    #
    # ★ 实现要点（2026-09-20 实测踩坑，两处都是 nginx 的经典陷阱）：
    #
    #   ① **正则 location 优先级高于前缀 location**：若把
    #      `location ~* \.(js|css|...)$` 放在 server 顶层，它会抢在 `/ai/` 之前
    #      命中 `/ai/assets/index-xxx.js`，再去教务系统的 root 里找 → 404 白屏。
    #      解决：正则 location 一律嵌进各自的前缀 location 内，互不干扰。
    #
    #   ② **`alias` + `try_files` 组合在正则 location 里会解析错路径**（nginx 已知行为，
    #      `try_files` 会拿 alias 拼接后的值再去拼一次）。工作台的资源 URL 本身就带
    #      `/ai/` 前缀，与磁盘目录名 `html-ai` 不一致，因此改用 **`rewrite` 剥前缀 +
    #      `root`** 的方式，路径拼接明确、不依赖 alias 的歧义行为。
    #
    # 磁盘布局：/usr/share/nginx/html-ai/  ← 工作台产物（URL /ai/xxx → 磁盘 /ai/xxx）
    location /ai/ {
        root /usr/share/nginx/html-ai;

        # 资源文件名固定带内容哈希，可长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # 其余路径（含 hash 路由的入口）回落到工作台 index.html
        try_files $uri $uri/ /ai/index.html;

        # index.html 禁用缓存，避免构建后引用失效的旧 chunk
        location = /ai/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # ── 教务系统（挂根路径）──────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;

        # 教务系统自己的静态资源。
        # ★ 必须嵌在 `location /` 内部：正则 location 优先级高于前缀 location，
        #   若放在 server 顶层会抢走 /ai/assets/*，导致工作台白屏（实测踩过）。
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }
    }
}

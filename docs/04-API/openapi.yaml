        "200": { description: 成功 }

  /api/notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: 单条标记已读
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 成功 }

  /api/notifications/read-all:
    put:
      tags: [Notifications]
      summary: 全部标记已读
      responses:
        "200": { description: 成功 }

  # --------------------------------------------------------------- Todos
  # 待办：教务端（校区负责人）与 AI 工作台（一线老师）**同一张表**，按 owner 过滤。
  # ★ 权限边界在**路由内的归属校验**，不靠路径：teacher 传 scope=all 也会被收敛为自己。
  /api/todos:
    get:
      tags: [Todos]
      summary: 待办列表（teacher 强制仅自己；admin 可用 scope=all 看全部）
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine }, description: 仅 admin 的 all 生效；teacher 一律收敛为 mine }
        - { name: status, in: query, schema: { type: string, enum: [待办, 已完成] } }
        - { name: priority, in: query, schema: { type: string, enum: [普通, 重要, 紧急] } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: owner_id, in: query, schema: { type: integer }, description: 仅 admin 且 scope=all 时生效 }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { description: 成功（data.list / data.total / data.pendingCount） }
    post:
      tags: [Todos]
      summary: 新建待办（owner 默认自己；★ 仅 admin 可指派他人）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 100 }
                content: { type: string, maxLength: 5000 }
                priority: { type: string, enum: [普通, 重要, 紧急], default: 普通 }
                due_date: { type: string, format: date, nullable: true }
                owner_id: { type: integer, description: 仅 admin 可传；teacher 传他人 id 返回 403 }
      responses:
        "200": { description: 成功 }
        "400": { description: 标题为空或不存在的负责人 }
        "403": { description: 非 admin 试图指派给他人 }

  /api/todos/generate:
    post:
      tags: [Todos]
      summary: 手动触发一次自动生成（★ 仅 admin）
      description: |
        按**归属矩阵**把 4 类业务事件转成待办，**幂等**（一条来源 = 一条待办，靠唯一索引去重）：
        - `tuition_low`（学员余额/课时不足）、`lead_follow`（线索待跟进） → **仅 admin**
          （数据源分别是财务表 `orders` 与对老师零开放的 `leads`）
        - `absent_streak`（连续缺勤）、`eval_missing`（课评欠录） → **该班班主任 + admin**

        常规触发有两条：① 打开待办/铃铛时按需（60 秒节流）② 每 6 小时的定时任务。
        本端点用于排查与验收。
      parameters:
        - { name: force, in: query, schema: { type: string, enum: ["1"] }, description: 传 1 跳过 60 秒节流 }
      responses:
        "200": { description: 成功（data.created / data.reopened / data.skipped / data.candidates） }
        "403": { description: 非 admin }

  /api/todos/{id}:
    put:
      tags: [Todos]
      summary: 修改待办（含标记完成；本人或 admin）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                content: { type: string, maxLength: 5000 }
                status: { type: string, enum: [待办, 已完成], description: 转已完成会写 completed_at；退回时清空 }
                priority: { type: string, enum: [普通, 重要, 紧急] }
                due_date: { type: string, format: date, nullable: true }
                owner_id: { type: integer, description: 改负责人仅 admin }
      responses:
        "200": { description: 成功 }
        "400": { description: 标题为空或超长 }
        "403": { description: 既非本人也非 admin，或非 admin 试图改负责人 }
        "404": { description: 待办不存在 }
    delete:
      tags: [Todos]
      summary: 删除待办（本人或 admin）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 成功 }
        "403": { description: 既非本人也非 admin }
        "404": { description: 待办不存在 }

  # --------------------------------------------------------------- Analytics
  /api/analytics/metrics:
    get:
      tags: [Analytics]
      summary: 指标定义字典（12 项，供 AI 解析口径）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/analytics/overview:
    get:
      tags: [Analytics]
      summary: 全局经营概览（21 项指标 + 近 12 月营收趋势 + 渠道转化）
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AnalyticsEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          meta:
                            type: object
                            properties:
                              revenue_trend:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    month: { type: string }
                                    amount: { type: number }
                                    count: { type: integer }
                              channel_stats:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    source: { type: string }
                                    total: { type: integer }
                                    converted: { type: integer }
                                    conversion_rate: { type: number }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/analytics/{dataset}/export:
    get:
      tags: [Analytics]
      summary: 批量数据导出（attendance / finance / leads / scores）
      parameters:
        - name: dataset
          in: path
          required: true
          schema: { type: string, enum: [attendance, finance, leads, scores] }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: |
            `format=json`（默认）返回 AI 分析信封；`format=csv` 返回带 UTF-8 BOM 的 CSV 附件
            （`Content-Type: text/csv; charset=utf-8`，`Content-Disposition: attachment`）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsEnvelope" }
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 未知数据集（`data.supported` 返回可用数据集）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/ai/sso/ticket:
    post:
      tags: [AI 工作台]
      summary: 签发一次性免登票据（跳转 AI 教学工作台）
      description: |
        生成 60 秒有效、一次性使用的免登票据，供浏览器跳转至独立部署的 AI 教学工作台。
        票据置于跳转 URL 的 hash 片段中，不随请求发送到服务器，不进入访问日志。
        载荷仅含 `{ id, username, role, tv, type, jti }`，不含姓名、手机号、金额等业务字段。

        请求体可选传 `origin`（前端传 `window.location.origin`）。当 `AI_WORKBENCH_URL`
        配置为回环地址（localhost/127.0.0.1，同源部署默认）时，返回的 `url` 会是
        「访问者 origin + AI_WORKBENCH_BASE_PATH」，从而兼容 IP / 域名 / 80 / HTTPS。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                origin:
                  type: string
                  description: 前端所在 origin（含协议+主机+端口），用于同源部署时跟随访问者地址
                  example: http://192.168.1.20:8080
      responses:
        "200":
          description: 签发成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      ticket:
                        type: string
                        description: 一次性票据（JWT，HS256，复用 JWT_SECRET）
                      url:
                        type: string
                        description: 工作台跳转地址，票据位于 hash 片段
                        example: http://192.168.1.20:8080/ai/#/sso?ticket=eyJhbGciOi...
                      expiresIn: { type: integer, example: 60 }
        "401":
          description: 未登录 / Token 失效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/ai/sso/verify:
    post:
      tags: [AI 工作台]
      summary: 校验票据并换取工作台会话
      description: |
        公开端点（票据本身即凭证，不需要 Authorization 头）。
        票据一次性：校验通过后立即作废，重复使用返回 401。
        同时比对票据中的 `tv` 与 `users.token_version`，因此登出 / 改密 / 改角色后票据立即失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket:
                  type: string
                  description: 由 `/api/ai/sso/ticket` 签发的一次性票据
      responses:
        "200":
          description: 校验通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      role: { type: string, enum: [admin, teacher] }
                      loginAt: { type: string, format: date-time }
                      scope:
                        type: string
                        enum: [all, own]
                        description: admin 为 all，teacher 为 own（工作台据此限制数据范围）
                      agentToken:
                        type: string
                        description: |
                          工作台凭证（type = ai_agent，有效期 12 小时）。

                          可访问范围（路径白名单，见 `server/src/middleware/auth.js`）：
                          - `/api/agent/*`、`/api/ai/*` —— 只读网关
                          - `/api/growth/*` —— 成长采集与查询（★ 读写同权，见下）

                          **为什么放行整个 /api/growth**：教务系统给校区负责人/非一线教学人员，
                          教学 AI 工作台给一线老师，**老师要用的功能一律收在工作台**，
                          于是"课后采集"与"看学生成长路径"都落在工作台，二者共用同一数据域。

                          **读写必须同权**：曾一度只放行写（采集端）、挡住读（查询端），
                          结果是老师能往班里写数据却看不到自己写的数据，成长路径页整页 403。
                          安全边界不靠"挡住读"，而靠：
                          ① 端点内部复用 `canManageClass`/`canManageStudent`，**跨班一律 403**；
                          ② 数据域只含教学口径（出勤/课堂表现/知识点/成绩/课时数量），
                             不含金额、订单、退费、家长信息；
                          ③ 管理动作仍挡住 —— 唯一例外是 `PUT /api/growth/thresholds`
                             （改全局阈值，仅 admin），文件路径白名单以管理动作形式排除。

                          其余 `/api/*` 一律 403（财务、用户、班级/学生增删改……）。
        "400":
          description: 缺少票据或类型不正确
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: 票据无效 / 已过期 / 已被使用 / 类型不符 / 登录状态已失效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/agent/context:
    get:
      tags: [AI 只读网关]
      summary: 教学上下文（身份 / 可见班级 / 数据能力位）
      description: |
        AI 教学工作台取数入口。按当前用户数据范围返回可见班级：
        admin 为全部，teacher 仅 `classes.head_teacher_id` 为自己的班级。
        `capabilities` 如实反映真实库里已有哪类数据，供工作台决定展示真实值还是标注「待建设」。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          role: { type: string, enum: [admin, teacher] }
                      classes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            grade: { type: string }
                            student_count: { type: integer }
                      capabilities:
                        type: object
                        description: |
                          能力开关由后端按**实际库状态**实时下发（不是写死的常量）。
                          前端据此决定展示哪些模块与采集入口；
                          **不要把"没有数据"渲染成 0** —— 应引导用户去产生数据。
                        properties:
                          students: { type: boolean }
                          attendance: { type: boolean }
                          scores: { type: boolean }
                          hours: { type: boolean }
                          evaluations: { type: boolean, description: v18 起有 class_evaluations 表，有数据即为 true }
                          knowledge: { type: boolean, description: v18 起有 knowledge_points 表，有数据即为 true }
                          timeline: { type: boolean, description: v18 新增：成长时间轴是否已有数据 }
                          kpAssessments: { type: boolean, description: v18 新增：知识点评定是否已有数据 }
                          questions: { type: boolean, description: 当前库尚无 questions 表，恒为 false }
                      data_version: { type: string, example: v18 }
        "401":
          description: 未登录 / 凭证失效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/agent/classes/{id}/overview:
    get:
      tags: [AI 只读网关]
      summary: 班级概览（学员 + 考勤/成绩/课时聚合，不含金额）
      description: |
        只读端点：不含任何金额、家长姓名与电话，学员仅保留编号与姓名。
        `attendance.rate` 与 `avg_rate` / `trend` 在无记录时返回 null（区别于 0）。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 班级 ID
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:

  # ────────────────────────────────────────────────────────────────
  # 成长路径（v18）
  #
  # ★ 人群分离：教务系统（:8080）给校区负责人/非一线教学人员；
  #   教学 AI 工作台（统一入口 /ai/）给一线老师。**老师要用的功能一律收在工作台**，
  #   因此采集端（eval-form / class-eval / kp-assessment）与查询端的入口都在工作台。
  #
  # ★ 工作台凭证（type=ai_agent）对 /api/growth 整体放行 ——
  #   读写必须同权：曾只放行写而挡住读，导致老师能写却看不到自己写的数据，
  #   成长路径页整页 403。安全边界靠 canManageClass（跨班 403），不靠"挡住读"。
  #   唯一例外：PUT /thresholds 属管理动作，仍仅 admin。
  # ────────────────────────────────────────────────────────────────
  /api/growth/eval-form:
    get:
      tags: [Growth]
      summary: 课后采集预填数据（名单 + 可评知识点 + 今日已评）
      description: |
        老师打开「授课流程」页时的预填数据 —— 不让老师自己找该评什么。

        **`knowledge_points[]` 只含叶子知识点（可评定对象）**，单元节点被后端过滤。
        `knowledge_points` 是两级结构：单元（`seq=0` / `parent_id IS NULL`）与其下的
        知识点（`seq>0` / `parent_id=单元 id`）。单元是分组标题，老师无法打勾；
        不过滤会有两个后果：① 出现无法操作的行；② 单元节点占掉 LIMIT 名额，
        把真正可评的知识点挤出去。单元名以 `unit_name` 带下来做分组标题。
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: query
          required: true
          schema: { type: integer }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-09-20" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/GrowthEvalForm" }
        "400":
          description: 参数不合法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: 无权操作该班
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }


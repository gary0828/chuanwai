  /api/growth/kp-assessment:
    post:
      tags: [Growth]
      summary: 批量知识点评定（老师课后 1 分钟动作）
      description: |
        每条评定都会向时间轴追加一条 `kp_assessment` 事件（含 `from` 上次等级与 `changed`）。
        **即使等级未变也写** —— 这条记录本身就是"老师每节课都看了学生状态"的过程证据，
        跳过未变化的评定会让成长路径退化成"起点→终点"两点，丢失中间过程。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KpAssessmentInput" }
      responses:
        "200":
          description: 成功

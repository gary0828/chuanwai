    post:
      tags: [Sessions]
      summary: 未匹配项一键转待办（仅 admin，Q6 指派 admin）
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties: { todo_id: { type: integer } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 报告记录不存在, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /api/sessions/{id}:
    get:
      tags: [Sessions]
      summary: 课次详情（名单 / 课评 / 课消 / 关联课次）
      description: 含该课次代课人（Q5 代课人可读他代的那一节）。
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/SessionDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 课次不存在, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /api/sessions/{id}/stop:
    put:
      tags: [Sessions]
      summary: 停课（待上课 → 已停课，仅 admin）
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 成功, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sessions/{id}/restore:
    put:
      tags: [Sessions]
      summary: 恢复（已停课 → 待上课，仅 admin，Q9）
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 成功, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sessions/{id}/reschedule:
    post:
      tags: [Sessions]
      summary: 调课（仅待上课；新建课次 + 双向关联，仅 admin，Q4）
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_date, period]
              properties:
                session_date: { type: string }
                period: { type: integer, minimum: 1, maximum: 8 }
                room_id: { type: integer, nullable: true }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties: { new_session_id: { type: integer } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sessions/{id}/substitute:
    post:
      tags: [Sessions]
      summary: 代课（原 teacher_id 不变，另写 substitute_teacher_id，仅 admin）
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [substitute_teacher_id]
              properties:
                substitute_teacher_id: { type: integer }
                room_id: { type: integer, nullable: true }
      responses:
        "200": { description: 成功, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/teaching-assignments:
    get:
      tags: [TeachingAssignments]
      summary: 任课关系列表（教师仅本班）
      security: [{bearerAuth: []}]
      parameters:
        - { in: query, name: class_id, schema: { type: integer } }
        - { in: query, name: teacher_id, schema: { type: integer } }
        - { in: query, name: term_id, schema: { type: integer } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      list: { type: array, items: { $ref: "#/components/schemas/TeachingAssignment" } }
                      total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [TeachingAssignments]
      summary: 新增任课关系（仅 admin）
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingAssignmentInput" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties: { id: { type: integer } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/teaching-assignments/{id}:
    put:
      tags: [TeachingAssignments]
      summary: 修改任课关系（仅 admin）
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingAssignmentInput" }
      responses:
        "200": { description: 成功, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 任课关系不存在, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    delete:
      tags: [TeachingAssignments]
      summary: 删除任课关系（仅 admin）
      security: [{bearerAuth: []}]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 成功, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 任课关系不存在, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /api/period-times:
    get:
      tags: [PeriodTimes]
      summary: 节次时间表（1–8 节起止时间）
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/PeriodTime" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [PeriodTimes]
      summary: 批量保存节次时间（仅 admin，仅 1–8 节）
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [period]
                    properties:
                      period: { type: integer, minimum: 1, maximum: 8 }
                      start_time: { type: string, description: HH:mm 或空串 }
                      end_time: { type: string, description: HH:mm 或空串 }
                      label: { type: string, maxLength: 20 }
      responses:
        "200": { description: 成功, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 参数错误或业务规则拒绝
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: 未登录 / Token 失效 / 凭证已被吊销（登出、改密、改角色后 token_version 不再匹配）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: 登录失败次数过多（默认 15 分钟内 10 次失败；`LOGIN_RATE_LIMIT_MAX` 可调）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: 无权限（教师越权 / 非 admin）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: 该学员已有报班记录，不能删除 }

    AnalyticsEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            metrics: { type: object, additionalProperties: true }
            records: { type: array, items: { type: object } }
            meta:
              type: object
              properties:
                generated_at: { type: string, format: date-time }
                period:
                  type: object
                  properties:
                    start: { type: string, nullable: true }
                    end: { type: string, nullable: true }
                total_count: { type: integer }
                data_version: { type: string, example: v14 }
                dataset: { type: string }
                dataset_label: { type: string }
        metric_definitions:
          type: object
          additionalProperties:
            type: object
            properties:
              name: { type: string }
              formula: { type: string }
              note: { type: string }
              source_table: { type: string }
              unit: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: admin123456 }
        type: { type: string, enum: [password, phone, wechat], default: password }

    LoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            expires: { type: string, example: "2026/09/18 10:00:00" }
            avatar: { type: string }
            username: { type: string }
            nickname: { type: string }
            roles: { type: array, items: { type: string } }
            permissions: { type: array, items: { type: string } }

    Student:
      type: object
      properties:
        id: { type: integer }
        student_no: { type: string }
        name: { type: string }
        gender: { type: string, enum: [男, 女] }
        phone: { type: string }
        email: { type: string }
        class_id: { type: integer }
        class_name: { type: string }
        status: { type: string, enum: [在读, 休学, 退学] }
        parent_name: { type: string }
        parent_phone: { type: string }
        source_channel: { type: string }
        enroll_date: { type: string, format: date }
        created_at: { type: string }

    StudentInput:
      type: object
      required: [student_no, name, class_id]
      properties:
        student_no: { type: string, description: 学号（全局唯一） }
        name: { type: string }
        class_id: { type: integer }
        gender: { type: string, enum: [男, 女], default: 男 }
        phone: { type: string }
        email: { type: string }
        status: { type: string, enum: [在读, 休学, 退学], default: 在读 }
        parent_name: { type: string }
        parent_phone: { type: string }
        source_channel: { type: string }
        enroll_date: { type: string, format: date }

    AttendanceRosterItem:
      type: object
      properties:
        student_id: { type: integer }
        student_no: { type: string }
        name: { type: string }
        gender: { type: string }
        status:
          type: string
          nullable: true
          description: 未登记时为 null
          enum: [正常, 迟到, 早退, 缺勤, 请假, null]
        remark: { type: string, nullable: true }
        attendance_id: { type: integer, nullable: true }

    ExamInput:
      type: object
      required: [name, class_id]
      properties:
        name: { type: string, description: 考试名称 }
        course_id: { type: integer }
        class_id: { type: integer }
        exam_date: { type: string, format: date }
        type: { type: string, enum: [单元测, 期中, 期末], default: 单元测 }
        full_score: { type: number, default: 100 }
        remark: { type: string }

    LeadInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        intent_course_id: { type: integer }
        source: { type: string, enum: [转介绍, 线上, 地推, 广告], default: 转介绍 }
        remark: { type: string }

    LeadConvertInput:
      type: object
      required: [class_id]
      properties:
        class_id: { type: integer, description: 转入班级 }
        course_id: { type: integer, description: 报班课程 }
        student_no: { type: string, description: 缺省由后端生成 }
        gender: { type: string, enum: [男, 女] }
        parent_name: { type: string, description: 缺省取线索姓名 }
        parent_phone: { type: string, description: 缺省取线索电话 }
        amount: { type: number, default: 0 }
        total_hours: { type: number, default: 0 }

    FeedbackInput:
      type: object
      required: [content]
      properties:
        category:
          type: string
          enum: [功能异常, 操作不便, 数据不准, 性能问题, 功能建议, 其他]
          default: 其他
          description: 非法值由后端回落为「其他」
        content:
          type: string
          minLength: 5
          maxLength: 2000
          description: 问题描述（5–2000 字）
        page_path:
          type: string
          maxLength: 200
          description: 出现问题时的页面路径（选填）

    FeedbackItem:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string, description: 提交人账号（仅 admin 全量列表返回） }
        user_role: { type: string, enum: [admin, teacher] }
        category: { type: string }
        content: { type: string }
        page_path: { type: string }
        status: { type: string, enum: [待处理, 处理中, 已处理, 已忽略] }
        admin_reply: { type: string }
        handled_by: { type: integer, nullable: true }
        handled_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    # ───────────── 成长路径（v18）─────────────
    KnowledgePoint:
      type: object
      description: |
        知识点（两级结构）。`parent_id IS NULL` 表示这是**单元节点**（分组标题，不可评定）；
        非空表示**叶子知识点**（可评定对象）。
      properties:
        id: { type: integer }
        parent_id: { type: integer, nullable: true }
        code: { type: string, example: "U1-2" }
        name: { type: string, example: "SSS 判定" }
        course_id: { type: integer, nullable: true }
        grade: { type: string, nullable: true }
        unit_no: { type: integer, example: 1 }
        seq: { type: integer, description: 单元节点为 0，叶子为 1..n }
        difficulty: { type: integer, minimum: 1, maximum: 5 }

    GrowthEvalForm:
      type: object
      description: 课后采集预填数据
      properties:
        class_id: { type: integer }
        date: { type: string, format: date }
        students:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              no: { type: string, description: 学号 }
              name: { type: string }
              evaluated: { type: boolean, description: 今日是否已评 }
              eval:
                nullable: true
                type: object
                properties:
                  focus: { type: integer, minimum: 1, maximum: 5 }
                  participation: { type: integer, minimum: 1, maximum: 5 }
                  mastery: { type: integer, minimum: 1, maximum: 5 }
                  note: { type: string }
        knowledge_points:
          type: array
          description: ★ 只含叶子知识点（可评定对象），单元节点已过滤；最多 40 条
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              name: { type: string }
              unit_no: { type: integer }
              unit_name: { type: string, nullable: true, description: 所属单元名，供分组标题用 }
              seq: { type: integer }
              difficulty: { type: integer }
        already_evaluated: { type: integer }

    ClassEvalInput:
      type: object
      required: [class_id, eval_date, items]
      properties:
        class_id: { type: integer }
        course_id: { type: integer, nullable: true }
        eval_date: { type: string, format: date }
        session_no: { type: integer, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [student_id]
            properties:
              student_id: { type: integer }
              focus: { type: integer, minimum: 1, maximum: 5, description: 越界自动夹取，缺省 3 }
              participation: { type: integer, minimum: 1, maximum: 5 }
              mastery: { type: integer, minimum: 1, maximum: 5 }
              note: { type: string }

    KpAssessmentInput:
      type: object
      required: [class_id, assessed_at, kps]
      properties:
        class_id: { type: integer }
        course_id: { type: integer, nullable: true }
        assessed_at: { type: string, format: date }
        session_no: { type: integer, nullable: true }
        kps:
          type: array
          items:
            type: object
            required: [kp_id, level]
            properties:
              kp_id: { type: integer }
              level:
                type: string
                enum: [未掌握, 部分掌握, 已掌握]
        student_ids:
          type: array
          description: 缺省 = 全班在读学员
          items: { type: integer }
        overrides:
          type: array
          description: 个别学员单独调整
          items:
            type: object
            properties:
              student_id: { type: integer }
              kp_id: { type: integer }
              level:
                type: string
                enum: [未掌握, 部分掌握, 已掌握]

    StudentTimeline:
      type: object
      properties:
        studentId: { type: integer }
        from: { type: string }
        to: { type: string }
        count: { type: integer }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: "kp_assessment" }
              label: { type: string }
              date: { type: string }
              summary: { type: string }
              payload: { type: object, additionalProperties: true }

    StudentGrowth:
      type: object
      description: 单学员成长画像
      properties:
        studentId: { type: integer }
        attendance: { type: object, additionalProperties: true }
        evalTrend: { type: array, items: { type: object, additionalProperties: true } }
        examSeries: { type: array, items: { type: object, additionalProperties: true } }
        kpProgress: { type: array, items: { type: object, additionalProperties: true } }
        milestones: { type: array, items: { type: object, additionalProperties: true } }
        range:
          type: object
          properties:
            from: { type: string, description: 无数据时为哨兵值 0000-01-01，前端需自行回落 }
            to: { type: string, description: 无数据时为哨兵值 9999-12-31，前端需自行回落 }

    ClassGrowth:
      type: object
      description: 整班成长概览
      properties:
        classId: { type: integer }
        studentCount: { type: integer }
        students:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              student_no: { type: string }
              name: { type: string }
        evalSeries:
          type: array
          items: { type: object, additionalProperties: true }
        kpMastery:
          type: array
          items: { type: object, additionalProperties: true }
        thresholds:
          type: object
          additionalProperties: { type: number }

    GrowthThresholds:
      type: object
      description: 成长阈值（8 条默认值，admin 可调，不重建镜像）
      additionalProperties: { type: number }

    SiteInfo:
      type: object
      description: |
        站点信息（机构名称 / Logo / 页脚）。存于 settings 表的 site.* 键。
        所有字段均可选：
        - `GET /api/site-info`（公开）**只返回非空的**，未配置的键直接不出现在响应里；
        - `GET /api/site-info/admin` 与 `PUT` 的响应返回**全部 12 个键**（未配置为空串）。
        **备案类字段留空表示不展示**，前端据此决定是否渲染对应行。
      properties:
        site.name: { type: string, description: 系统简称（侧边栏 / 登录页） }
        site.title: { type: string, description: 浏览器标签页完整标题 }
        site.orgName: { type: string, description: 版权主体（机构全称） }
        site.sinceYear: { type: string, description: 起始年份，4 位数字 }
        site.slogan: { type: string, description: 登录页副标题 }
        site.contact: { type: string, description: 联系电话 }
        site.address: { type: string, description: 地址 }
        site.icp: { type: string, description: ICP 备案号（当前场景留空） }
        site.policeNo: { type: string, description: 公安备案号（当前场景留空） }
        site.copyrightExtra: { type: string, description: 页脚补充说明 }
        site.logo: { type: string, description: Logo 路径，如 /assets/site/xxx.png }
        site.favicon: { type: string, description: 标签页图标路径 }

    Session:
      type: object
      description: 课次实例（class_sessions）
      properties:
        id: { type: integer }
        term_id: { type: integer, nullable: true }
        schedule_id: { type: integer, nullable: true }
        class_id: { type: integer }
        class_name: { type: string }
        course_id: { type: integer }
        course_name: { type: string }
        teacher_id: { type: integer, nullable: true }
        teacher_name: { type: string, nullable: true }
        substitute_teacher_id: { type: integer, nullable: true }
        substitute_teacher_name: { type: string, nullable: true }
        room_id: { type: integer, nullable: true }
        session_date: { type: string, description: YYYY-MM-DD }
        period: { type: integer, minimum: 1, maximum: 8 }
        start_time: { type: string, description: 生成时快照 }
        end_time: { type: string, description: 生成时快照 }
        status: { type: string, enum: [待上课, 已上课, 已停课, 已调课, 已取消] }
        origin: { type: string, enum: [模板生成, 调课, 补课, 手工] }
        related_session_id: { type: integer, nullable: true }
        related_date: { type: string, nullable: true }
        topic: { type: string }

    SessionInput:
      type: object
      required: [class_id, course_id, session_date, period]
      properties:
        class_id: { type: integer }
        course_id: { type: integer }
        teacher_id: { type: integer, nullable: true }
        session_date: { type: string }
        period: { type: integer, minimum: 1, maximum: 8 }
        room_id: { type: integer, nullable: true }
        origin: { type: string, enum: [手工, 补课], default: 手工 }

    SessionWeek:
      type: object
      properties:
        week_start: { type: string }
        week_end: { type: string }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              day_of_week: { type: integer }
              label: { type: string }
              is_today: { type: boolean }
        periods:
          type: array
          items:
            type: object
            properties:
              period: { type: integer }
              label: { type: string }
              start_time: { type: string }
              end_time: { type: string }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }

    SessionPreview:
      type: object
      properties:
        to_create: { type: integer }
        already_exists: { type: integer }
        plan_total: { type: integer }
        classes: { type: integer }
        templates: { type: integer }
        missing_period_times:
          type: array
          items:
            type: object
            properties:
              period: { type: integer }
              label: { type: string }
        range:
          type: object
          properties:
            start: { type: string }
            end: { type: string }

    SessionGenerateResult:
      type: object
      properties:
        created: { type: integer }
        skipped: { type: integer }
        backfilled: { type: integer }
        report_unmatched: { type: integer }

    SessionBackfillResult:
      type: object
      properties:
        matched: { type: integer }
        unmatched: { type: integer }

    MigrationReport:
      type: object
      properties:
        list:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              data_type: { type: string, enum: [考勤, 课消, 课评] }
              source_table: { type: string }
              source_id: { type: integer }
              class_id: { type: integer, nullable: true }
              class_name: { type: string, nullable: true }
              course_id: { type: integer, nullable: true }
              student_id: { type: integer, nullable: true }
              student_name: { type: string, nullable: true }
              date: { type: string }
              reason: { type: string }
              status: { type: string, enum: [未匹配, 已转待办] }
              todo_id: { type: integer, nullable: true }
        total: { type: integer }
        summary:
          type: object
          properties:
            matched: { type: integer }
            unmatched: { type: integer }
            total: { type: integer }
            fail_rate: { type: number }

    SessionDetail:
      type: object
      properties:
        session: { $ref: "#/components/schemas/Session" }
        students:
          type: array
          items:
            type: object
            properties:
              student_id: { type: integer }
              student_no: { type: string }
              name: { type: string }
              status: { type: string, nullable: true }
              remark: { type: string, nullable: true }
              attendance_id: { type: integer, nullable: true }
        evaluations: { type: array, items: { type: object } }
        consumptions: { type: array, items: { type: object } }
        related: { type: object, nullable: true }

    TeachingAssignment:
      type: object
      properties:
        id: { type: integer }

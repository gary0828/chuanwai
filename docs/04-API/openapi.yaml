        course_name: { type: string }
        teacher_id: { type: integer, nullable: true }
        teacher_name: { type: string, nullable: true }
        term_id: { type: integer, nullable: true }
        term_name: { type: string, nullable: true }

    TeachingAssignmentInput:
      type: object
      required: [class_id, course_id]
      properties:
        class_id: { type: integer }
        course_id: { type: integer }
        teacher_id: { type: integer, nullable: true, description: 可空=未定教师 }
        term_id: { type: integer, nullable: true, description: 可空=长期有效 }

    PeriodTime:
      type: object
      properties:
        period: { type: integer, minimum: 1, maximum: 8 }
        start_time: { type: string }
        end_time: { type: string }
        label: { type: string }


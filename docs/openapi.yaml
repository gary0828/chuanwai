  # ────────────────────────────────────────────────────────────────
  # 成长路径（v18）
  #
  # ★ 人群分离：教务系统（:8080）给校区负责人/非一线教学人员；
  #   教学 AI 工作台（:8082）给一线老师。**老师要用的功能一律收在工作台**，
  #   因此采集端（eval-form / class-eval / kp-assessment）与查询端的入口都在工作台。
  #
  # ★ 工作台凭证（type=ai_agent）对 /api/growth 整体放行 ——
  #   读写必须同权：曾只放行写而挡住读，导致老师能写却看不到自己写的数据，
  #   成长路径页整页 403。安全边界靠 canManageClass（跨班 403），不靠"挡住读"。
  #   唯一例外：PUT /thresholds 属管理动作，仍仅 admin。
  # ────────────────────────────────────────────────────────────────
  /api/growth/eval-form:
    get:
      tags: [Growth]
      summary: 课后采集预填数据（名单 + 可评知识点 + 今日已评）
      description: |
        老师打开「授课流程」页时的预填数据 —— 不让老师自己找该评什么。

        **`knowledge_points[]` 只含叶子知识点（可评定对象）**，单元节点被后端过滤。
        `knowledge_points` 是两级结构：单元（`seq=0` / `parent_id IS NULL`）与其下的
        知识点（`seq>0` / `parent_id=单元 id`）。单元是分组标题，老师无法打勾；
        不过滤会有两个后果：① 出现无法操作的行；② 单元节点占掉 LIMIT 名额，
        把真正可评的知识点挤出去。单元名以 `unit_name` 带下来做分组标题。
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: query
          required: true
          schema: { type: integer }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-09-20" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/GrowthEvalForm" }
        "400":
          description: 参数不合法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: 无权操作该班
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/growth/class-eval:
    post:
      tags: [Growth]
      summary: 提交课堂评价（老师课后 10 秒动作）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassEvalInput" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      saved: { type: integer, description: 写入/覆盖的评价条数 }
                      appended: { type: integer, description: 向时间轴追加的事件数 }
                      eval_date: { type: string }
                      class_id: { type: integer }
        "403":
          description: 无权操作该班
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/growth/kp-assessment:
    post:
      tags: [Growth]
      summary: 批量知识点评定（老师课后 1 分钟动作）
      description: |
        每条评定都会向时间轴追加一条 `kp_assessment` 事件（含 `from` 上次等级与 `changed`）。
        **即使等级未变也写** —— 这条记录本身就是"老师每节课都看了学生状态"的过程证据，
        跳过未变化的评定会让成长路径退化成"起点→终点"两点，丢失中间过程。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KpAssessmentInput" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      students: { type: integer }
                      records: { type: integer }
        "403":
          description: 无权操作该班
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/growth/students/{id}/timeline:
    get:
      tags: [Growth]
      summary: 单学员成长时间轴
      description: 既有三表（考勤/成绩/课时）UNION + 新事件，已按 `(type, date)` 去重。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/StudentTimeline" }
        "403":
          description: 非本班学员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/growth/students/{id}/growth:
    get:
      tags: [Growth]
      summary: 单学员成长画像
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/StudentGrowth" }
        "403":
          description: 非本班学员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/growth/classes/{id}/growth:
    get:
      tags: [Growth]
      summary: 整班成长概览
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/ClassGrowth" }
        "403":
          description: 无权查看该班
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/growth/knowledge-points:
    get:
      tags: [Growth]
      summary: 知识点列表
      description: |
        返回**含单元节点的完整层级**（带 `parent_id`），供展示层做树/分组用。
        与 `eval-form` 的区别：`eval-form` 返回可评集合（仅叶子），本端点返回完整层级 ——
        两者定位不同，不应合并。
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgePoint" }

  /api/growth/thresholds:
    get:
      tags: [Growth]
      summary: 成长阈值（8 条）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/GrowthThresholds" }
    put:
      tags: [Growth]
      summary: 修改成长阈值（仅 admin）
      description: |
        ★ 管理动作 —— 改的是全局阈值，属配置而非教学行为。
        因此这是 `/api/growth` 内**唯一**不对工作台凭证（type=ai_agent）放行的路径，
        工作台调用会得到 403，应改用教务系统管理员账号操作。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: number }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/GrowthThresholds" }
        "403":
          description: 非 admin，或使用了工作台凭证
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 参数错误或业务规则拒绝
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: 未登录 / Token 失效 / 凭证已被吊销（登出、改密、改角色后 token_version 不再匹配）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: 登录失败次数过多（默认 15 分钟内 10 次失败；`LOGIN_RATE_LIMIT_MAX` 可调）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: 无权限（教师越权 / 非 admin）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: 该学员已有报班记录，不能删除 }

    AnalyticsEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            metrics: { type: object, additionalProperties: true }
            records: { type: array, items: { type: object } }
            meta:
              type: object
              properties:
                generated_at: { type: string, format: date-time }
                period:
                  type: object
                  properties:
                    start: { type: string, nullable: true }
                    end: { type: string, nullable: true }
                total_count: { type: integer }
                data_version: { type: string, example: v14 }
                dataset: { type: string }
                dataset_label: { type: string }
        metric_definitions:
          type: object
          additionalProperties:
            type: object
            properties:
              name: { type: string }
              formula: { type: string }
              note: { type: string }
              source_table: { type: string }
              unit: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: admin123456 }
        type: { type: string, enum: [password, phone, wechat], default: password }

    LoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            expires: { type: string, example: "2026/09/18 10:00:00" }
            avatar: { type: string }
            username: { type: string }
            nickname: { type: string }
            roles: { type: array, items: { type: string } }
            permissions: { type: array, items: { type: string } }

    Student:
      type: object
      properties:
        id: { type: integer }
        student_no: { type: string }
        name: { type: string }
        gender: { type: string, enum: [男, 女] }
        phone: { type: string }
        email: { type: string }
        class_id: { type: integer }
        class_name: { type: string }
        status: { type: string, enum: [在读, 休学, 退学] }
        parent_name: { type: string }
        parent_phone: { type: string }
        source_channel: { type: string }
        enroll_date: { type: string, format: date }
        created_at: { type: string }

    StudentInput:
      type: object
      required: [student_no, name, class_id]
      properties:
        student_no: { type: string, description: 学号（全局唯一） }
        name: { type: string }
        class_id: { type: integer }
        gender: { type: string, enum: [男, 女], default: 男 }
        phone: { type: string }
        email: { type: string }
        status: { type: string, enum: [在读, 休学, 退学], default: 在读 }
        parent_name: { type: string }
        parent_phone: { type: string }
        source_channel: { type: string }
        enroll_date: { type: string, format: date }

    AttendanceRosterItem:
      type: object
      properties:
        student_id: { type: integer }
        student_no: { type: string }
        name: { type: string }
        gender: { type: string }
        status:
          type: string
          nullable: true
          description: 未登记时为 null
          enum: [正常, 迟到, 早退, 缺勤, 请假, null]
        remark: { type: string, nullable: true }
        attendance_id: { type: integer, nullable: true }

    ExamInput:
      type: object
      required: [name, class_id]
      properties:
        name: { type: string, description: 考试名称 }
        course_id: { type: integer }
        class_id: { type: integer }
        exam_date: { type: string, format: date }
        type: { type: string, enum: [单元测, 期中, 期末], default: 单元测 }
        full_score: { type: number, default: 100 }
        remark: { type: string }

    LeadInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        intent_course_id: { type: integer }
        source: { type: string, enum: [转介绍, 线上, 地推, 广告], default: 转介绍 }
        remark: { type: string }

    LeadConvertInput:
      type: object
      required: [class_id]
      properties:
        class_id: { type: integer, description: 转入班级 }
        course_id: { type: integer, description: 报班课程 }
        student_no: { type: string, description: 缺省由后端生成 }
        gender: { type: string, enum: [男, 女] }
        parent_name: { type: string, description: 缺省取线索姓名 }
        parent_phone: { type: string, description: 缺省取线索电话 }
        amount: { type: number, default: 0 }
        total_hours: { type: number, default: 0 }

    FeedbackInput:
      type: object
      required: [content]
      properties:
        category:
          type: string
          enum: [功能异常, 操作不便, 数据不准, 性能问题, 功能建议, 其他]
          default: 其他
          description: 非法值由后端回落为「其他」
        content:
          type: string
          minLength: 5
          maxLength: 2000
          description: 问题描述（5–2000 字）
        page_path:
          type: string
          maxLength: 200
          description: 出现问题时的页面路径（选填）

    FeedbackItem:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string, description: 提交人账号（仅 admin 全量列表返回） }
        user_role: { type: string, enum: [admin, teacher] }
        category: { type: string }
        content: { type: string }
        page_path: { type: string }
        status: { type: string, enum: [待处理, 处理中, 已处理, 已忽略] }
        admin_reply: { type: string }
        handled_by: { type: integer, nullable: true }
        handled_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    # ───────────── 成长路径（v18）─────────────
    KnowledgePoint:
      type: object
      description: |
        知识点（两级结构）。`parent_id IS NULL` 表示这是**单元节点**（分组标题，不可评定）；
        非空表示**叶子知识点**（可评定对象）。
      properties:
        id: { type: integer }
        parent_id: { type: integer, nullable: true }
        code: { type: string, example: "U1-2" }
        name: { type: string, example: "SSS 判定" }
        course_id: { type: integer, nullable: true }
        grade: { type: string, nullable: true }
        unit_no: { type: integer, example: 1 }
        seq: { type: integer, description: 单元节点为 0，叶子为 1..n }
        difficulty: { type: integer, minimum: 1, maximum: 5 }

    GrowthEvalForm:
      type: object
      description: 课后采集预填数据
      properties:
        class_id: { type: integer }
        date: { type: string, format: date }
        students:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              no: { type: string, description: 学号 }
              name: { type: string }
              evaluated: { type: boolean, description: 今日是否已评 }
              eval:
                nullable: true
                type: object
                properties:
                  focus: { type: integer, minimum: 1, maximum: 5 }
                  participation: { type: integer, minimum: 1, maximum: 5 }
                  mastery: { type: integer, minimum: 1, maximum: 5 }
                  note: { type: string }
        knowledge_points:
          type: array
          description: ★ 只含叶子知识点（可评定对象），单元节点已过滤；最多 40 条
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              name: { type: string }
              unit_no: { type: integer }
              unit_name: { type: string, nullable: true, description: 所属单元名，供分组标题用 }
              seq: { type: integer }
              difficulty: { type: integer }
        already_evaluated: { type: integer }

    ClassEvalInput:
      type: object
      required: [class_id, eval_date, items]
      properties:
        class_id: { type: integer }
        course_id: { type: integer, nullable: true }
        eval_date: { type: string, format: date }
        session_no: { type: integer, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [student_id]
            properties:
              student_id: { type: integer }
              focus: { type: integer, minimum: 1, maximum: 5, description: 越界自动夹取，缺省 3 }
              participation: { type: integer, minimum: 1, maximum: 5 }
              mastery: { type: integer, minimum: 1, maximum: 5 }
              note: { type: string }

    KpAssessmentInput:
      type: object
      required: [class_id, assessed_at, kps]
      properties:
        class_id: { type: integer }
        course_id: { type: integer, nullable: true }
        assessed_at: { type: string, format: date }
        session_no: { type: integer, nullable: true }
        kps:
          type: array
          items:
            type: object
            required: [kp_id, level]
            properties:
              kp_id: { type: integer }
              level:
                type: string
                enum: [未掌握, 部分掌握, 已掌握]
        student_ids:
          type: array
          description: 缺省 = 全班在读学员
          items: { type: integer }
        overrides:
          type: array
          description: 个别学员单独调整
          items:
            type: object
            properties:
              student_id: { type: integer }
              kp_id: { type: integer }
              level:
                type: string
                enum: [未掌握, 部分掌握, 已掌握]

    StudentTimeline:
      type: object
      properties:
        studentId: { type: integer }
        from: { type: string }
        to: { type: string }
        count: { type: integer }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: "kp_assessment" }
              label: { type: string }
              date: { type: string }
              summary: { type: string }
              payload: { type: object, additionalProperties: true }

    StudentGrowth:
      type: object
      description: 单学员成长画像
      properties:
        studentId: { type: integer }
        attendance: { type: object, additionalProperties: true }
        evalTrend: { type: array, items: { type: object, additionalProperties: true } }
        examSeries: { type: array, items: { type: object, additionalProperties: true } }
        kpProgress: { type: array, items: { type: object, additionalProperties: true } }
        milestones: { type: array, items: { type: object, additionalProperties: true } }
        range:
          type: object
          properties:
            from: { type: string, description: 无数据时为哨兵值 0000-01-01，前端需自行回落 }
            to: { type: string, description: 无数据时为哨兵值 9999-12-31，前端需自行回落 }

    ClassGrowth:
      type: object
      description: 整班成长概览
      properties:
        classId: { type: integer }
        studentCount: { type: integer }
        students:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              student_no: { type: string }
              name: { type: string }
        evalSeries:
          type: array
          items: { type: object, additionalProperties: true }
        kpMastery:
          type: array
          items: { type: object, additionalProperties: true }
        thresholds:
          type: object
          additionalProperties: { type: number }

    GrowthThresholds:
      type: object
      description: 成长阈值（8 条默认值，admin 可调，不重建镜像）
      additionalProperties: { type: number }

    SiteInfo:
      type: object
      description: |
        站点信息（机构名称 / Logo / 页脚）。存于 settings 表的 site.* 键。
        **备案类字段留空表示不展示**，前端据此决定是否渲染对应行。
      properties:
        site.name: { type: string, description: 系统简称（侧边栏 / 登录页） }
        site.title: { type: string, description: 浏览器标签页完整标题 }
        site.orgName: { type: string, description: 版权主体（机构全称） }
        site.sinceYear: { type: string, description: 起始年份，4 位数字 }
        site.slogan: { type: string, description: 登录页副标题 }
        site.contact: { type: string, description: 联系电话 }
        site.address: { type: string, description: 地址 }
        site.icp: { type: string, description: ICP 备案号（当前场景留空） }
        site.policeNo: { type: string, description: 公安备案号（当前场景留空） }
        site.copyrightExtra: { type: string, description: 页脚补充说明 }
        site.logo: { type: string, description: Logo 路径，如 /assets/site/xxx.png }
        site.favicon: { type: string, description: 标签页图标路径 }


  /api/ai/sso/ticket:
    post:
      tags: [AI 工作台]
      summary: 签发一次性免登票据（跳转 AI 教学工作台）
      description: |
        生成 60 秒有效、一次性使用的免登票据，供浏览器跳转至独立部署的 AI 教学工作台。
        票据置于跳转 URL 的 hash 片段中，不随请求发送到服务器，不进入访问日志。
        载荷仅含 `{ id, username, role, tv, type, jti }`，不含姓名、手机号、金额等业务字段。

        请求体可选传 `origin`（前端传 `window.location.origin`）。当 `AI_WORKBENCH_URL`
        配置为回环地址（localhost/127.0.0.1，同源部署默认）时，返回的 `url` 会是
        「访问者 origin + AI_WORKBENCH_BASE_PATH」，从而兼容 IP / 域名 / 80 / HTTPS。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                origin:
                  type: string
                  description: 前端所在 origin（含协议+主机+端口），用于同源部署时跟随访问者地址
                  example: http://192.168.1.20:8080
      responses:
        "200":
          description: 签发成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      ticket:
                        type: string
                        description: 一次性票据（JWT，HS256，复用 JWT_SECRET）
                      url:
                        type: string
                        description: 工作台跳转地址，票据位于 hash 片段
                        example: http://192.168.1.20:8080/ai/#/sso?ticket=eyJhbGciOi...
                      expiresIn: { type: integer, example: 60 }
        "401":
          description: 未登录 / Token 失效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/ai/sso/verify:
    post:
      tags: [AI 工作台]
      summary: 校验票据并换取工作台会话
      description: |
        公开端点（票据本身即凭证，不需要 Authorization 头）。
        票据一次性：校验通过后立即作废，重复使用返回 401。
        同时比对票据中的 `tv` 与 `users.token_version`，因此登出 / 改密 / 改角色后票据立即失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket:
                  type: string
                  description: 由 `/api/ai/sso/ticket` 签发的一次性票据
      responses:
        "200":
          description: 校验通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      role: { type: string, enum: [admin, teacher] }
                      loginAt: { type: string, format: date-time }
                      scope:
                        type: string
                        enum: [all, own]
                        description: admin 为 all，teacher 为 own（工作台据此限制数据范围）
                      agentToken:
                        type: string
                        description: |
                          工作台凭证（type = ai_agent，有效期 12 小时）。

                          可访问范围（路径白名单，见 `server/src/middleware/auth.js`）：
                          - `/api/agent/*`、`/api/ai/*` —— 只读网关
                          - `/api/growth/*` —— 成长采集与查询（★ 读写同权，见下）

                          **为什么放行整个 /api/growth**：教务系统给校区负责人/非一线教学人员，
                          教学 AI 工作台给一线老师，**老师要用的功能一律收在工作台**，
                          于是"课后采集"与"看学生成长路径"都落在工作台，二者共用同一数据域。

                          **读写必须同权**：曾一度只放行写（采集端）、挡住读（查询端），
                          结果是老师能往班里写数据却看不到自己写的数据，成长路径页整页 403。
                          安全边界不靠"挡住读"，而靠：
                          ① 端点内部复用 `canManageClass`/`canManageStudent`，**跨班一律 403**；
                          ② 数据域只含教学口径（出勤/课堂表现/知识点/成绩/课时数量），
                             不含金额、订单、退费、家长信息；
                          ③ 管理动作仍挡住 —— 唯一例外是 `PUT /api/growth/thresholds`
                             （改全局阈值，仅 admin），文件路径白名单以管理动作形式排除。

                          其余 `/api/*` 一律 403（财务、用户、班级/学生增删改……）。
        "400":
          description: 缺少票据或类型不正确
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: 票据无效 / 已过期 / 已被使用 / 类型不符 / 登录状态已失效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/agent/context:
    get:
      tags: [AI 只读网关]
      summary: 教学上下文（身份 / 可见班级 / 数据能力位）
      description: |
        AI 教学工作台取数入口。按当前用户数据范围返回可见班级：
        admin 为全部，teacher 仅 `classes.head_teacher_id` 为自己的班级。
        `capabilities` 如实反映真实库里已有哪类数据，供工作台决定展示真实值还是标注「待建设」。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 后端 API 反代（docker-compose 服务名 server）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ★ 用户上传的资产（Logo / 图标）：文件在后端容器的 /app/data/assets，
    #   必须反代到后端，不能由 nginx 从自己的 docroot 找。
    #   ⚠️ 必须用 ^~ 前缀：否则会被下面 `\.(png|svg|...)$` 的正则 location 抢走
    #   （nginx 规则：正则 location 优先级高于普通前缀），而那里是 `try_files $uri =404`，
    #   在 nginx docroot 里根本没有这些文件 → 一律 404。
    #   症状：设置页预览正常（走 /api 反代拿不到、但前端是 objectURL），
    #        上传成功后侧边栏 / 登录页 Logo **裂图**（404）。2026-09-21 实测踩到。
    location ^~ /assets/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片可长缓存；文件名带时间戳+随机串，每次上传都是新 URL，无失效问题
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 前端静态资源（pure-admin 为 hash 路由，SPA fallback 到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 禁用缓存，避免构建后旧 entry 引用失效的 chunk
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 静态资源缓存（hash 文件名，可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}

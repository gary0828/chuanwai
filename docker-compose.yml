# ═══════════════════════════════════════════════════════════════════
# 教务管理系统 · 统一入口部署（唯一编排文件）
#
# 形态：一个 nginx 同时托管「教务系统 + AI 工作台」，并把 /api 反代到后端。
#   /        → 教务系统
#   /ai/     → AI 教学工作台
#   /api/    → 教务后端
#
# 为什么只有这一份（2026-09-23 起统一）：
#   1. 「AI 助手」跳转地址 = 访问者当前 origin，天然兼容 IP / 域名 / 端口 / HTTPS；
#   2. 对外只需放行 1 个端口，公网暴露面最小；
#   3. 后端 CORS 天然同源，无需维护来源白名单；
#   4. 取消原先并存的「三端口」形态，开发与部署共用同一条编排，彻底消除脱同步。
#
# 启动：docker compose up -d --build
# 端口：对外端口取 .env 里的 WEB_PORT（缺省 80）。
#       ⚠ 无域名场景请用高位端口（如 18080）—— 大陆 80/443 对外服务需 ICP 备案。
#       部署脚本 deploy/linux-server-setup.sh 默认即为 18080。
#       手动执行时：echo "WEB_PORT=18080" >> .env
#
# 大模型 Key：不再经 .env / compose 注入 —— 登录后到「AI 配置中心」页面
#   (http://<地址>/#/ai-admin) 在页面里配置。Key 存数据库 settings 表、改完即生效、
#   永不下发前端（见 ADR-007）。
#
# ⚠ 首次从旧版本升级：旧编排的容器名与新的一致，请先清理再起，避免 name conflict：
#   docker rm -f attendance-server attendance-unified attendance-web attendance-ai-workbench 2>/dev/null || true
#   docker compose up -d --build
#   （数据在 bind mount ./server/data，删容器不会丢数据）
# ═══════════════════════════════════════════════════════════════════
name: attendance-system

services:
  server:
    image: attendance-system-server
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: attendance-server
    restart: unless-stopped
    environment:
      - PORT=3000
      # JWT 签名密钥（必需）。缺失时后端会直接拒绝启动，不再回退到源码默认值。
      # 生成：openssl rand -hex 32
      # 注入方式（任选其一）：
      #   1) 在项目根目录放置 .env 文件，写入一行 JWT_SECRET=<64位十六进制>
      #   2) 直接在执行 `docker compose up` 的 shell 中 export JWT_SECRET=...
      # `:?` 语法确保变量为空时 compose 直接报错，避免带病启动。
      - JWT_SECRET=${JWT_SECRET:?未设置 JWT_SECRET，请先执行 export JWT_SECRET=$(openssl rand -hex 32)}
      # 同源部署下浏览器发的是同源请求（无 Origin 头，或 Origin 就是本站），CORS 不会拦；
      # 此处保留本机调试来源即可。
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:8080}
      # 登录失败限速：窗口内最大尝试次数（默认 10 次 / 15 分钟）
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-10}
      # ★ 同源部署的关键两行：配成回环地址 = 「跟随访问者 origin」
      #   AI_WORKBENCH_URL 故意配成回环地址，后端会把它替换为访问者实际访问的地址，
      #   因此无论老师用 IP、域名、还是 HTTPS，跳转都不会错。
      - AI_WORKBENCH_URL=${AI_WORKBENCH_URL:-http://localhost}
      # 工作台挂在 /ai/ 子路径下，跳转 URL 需要带上该前缀
      - AI_WORKBENCH_BASE_PATH=${AI_WORKBENCH_BASE_PATH:-/ai}
    volumes:
      # SQLite 数据持久化（首次启动自动建表 + 种子数据）
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 不对外暴露 3000：只允许 nginx 经内部网络访问，公网扫不到后端
    expose:
      - "3000"

  # 统一入口：一个 nginx 同时托管教务系统 / + AI 工作台 /ai/ + 反代 /api
  unified:
    image: attendance-system-unified
    build:
      context: .
      dockerfile: deploy/Dockerfile.unified
    container_name: attendance-unified
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 对外唯一入口，端口取 .env 的 WEB_PORT（缺省 80）。
      # 无域名请设 18080 等高位端口（见文件头说明）。
      - "${WEB_PORT:-80}:80"

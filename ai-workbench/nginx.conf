# AI 教学工作台：静态资源托管 + 教务系统 API 同源反代
#
# 同源反代的意义：
#   工作台调用 /api/ai/sso/verify 换取会话、调用 /api/agent/* 取只读数据，
#   全部走相对路径 → 与页面同源，既不需要 CORS 白名单，也不暴露教务后端端口。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ★ 上传体积上限。nginx 默认仅 **1MB** → 超过即在 nginx 层被拒（413），
    #   请求到不了后端。Logo 上传、Excel 导入都会踩。
    #   三份 nginx 配置（web / ai-workbench / unified）必须保持一致。
    client_max_body_size 20m;

    # hash 路由：任意未命中路径都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 教务系统 API（免登票据 + 只读数据网关）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ★ 用户上传的资产（站点 Logo / 图标）：实体在后端容器的 /app/data/assets/site，
    #   本 frontend 的 docroot 里没有，必须反代到后端。
    #
    # ⚠️⚠️ 前缀**只能收窄到 `/assets/site/`，绝不能写 `/assets/`**（2026-09-21 踩坑实录）：
    #   工作台**自己的构建产物就在 `/assets/` 顶层**（`/assets/index-*.js`、
    #   `/assets/Todos-*.js` —— 见本容器 `/usr/share/nginx/html/assets/`），
    #   而教务端的产物在 `/static/`（所以教务端写 `/assets/` 没事，工作台会死）。
    #   一旦把 `/assets/` 整体反代给后端 → 工作台自己的 JS/CSS 全部 404 → **整页白屏**。
    #   ⚠️ 且 `/` 仍返回 200（HTML 是好的）—— **只看根路径 200 会误判为正常**，必须验 JS。
    #
    #   必须用 `^~`：否则会被下面 `\.(js|css|png|...)$` 正则抢走并当本地文件找不到 → 404。
    #   （nginx 规则：正则 location 优先级高于普通前缀 location）
    #
    #   后端资产目录约定 `server/data/assets/<kind>/`（ADR-008）。**新增 kind 时要在这里补一条。**
    location ^~ /assets/site/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 静态资源缓存（文件名带内容哈希，可长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

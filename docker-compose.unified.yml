# 统一入口部署（推荐）—— 对外只开一个端口
#
# 形态：一个 nginx 同时托管「教务系统 + AI 工作台」，并把 /api 反代到后端。
#   /        → 教务系统
#   /ai/     → AI 教学工作台
#   /api/    → 教务后端
#
# 为什么推荐这个形态（而非三个端口）：
#   1. 「AI 助手」跳转地址 = 访问者当前 origin，天然兼容
#      IP 访问 / 域名访问 / 80 端口 / 443 HTTPS，无需改配置；
#   2. 对外只需放行 1 个端口，公网暴露面最小；
#   3. 后端 CORS 天然同源，不需要维护来源白名单。
#
# 启动：docker compose -f docker-compose.unified.yml up -d --build
# 端口：本文件默认对外 80；若 80 已被占用（如 PVE 宿主机已有 nginx），
#       把下面的 "80:80" 改成 "8080:80" 或任意空闲端口。

name: attendance-unified

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: attendance-server
    restart: unless-stopped
    environment:
      - PORT=3000
      # JWT 签名密钥（必需）。缺失时后端直接拒绝启动。
      # 生成：openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:?未设置 JWT_SECRET，请先执行 export JWT_SECRET=$(openssl rand -hex 32)}
      # 同源部署下浏览器发的是同源请求（无 Origin 头，或 Origin 就是本站），
      # CORS 不会拦；此处保留本机调试来源即可。
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:8080}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-10}
      # ★ 同源部署的关键三行：配成回环地址 = 「跟随访问者 origin」
      #   AI_WORKBENCH_URL 故意配成回环地址，后端会把它替换为访问者实际访问的地址，
      #   因此无论老师用 IP、域名、还是 HTTPS，跳转都不会错。
      - AI_WORKBENCH_URL=${AI_WORKBENCH_URL:-http://localhost}
      # 工作台挂在 /ai/ 子路径下，跳转 URL 需要带上该前缀
      - AI_WORKBENCH_BASE_PATH=${AI_WORKBENCH_BASE_PATH:-/ai}
      # 大模型（可选）：配置后工作台可切「服务端模型」；留空则走规则引擎
      # Key 只注入后端容器，绝不下发前端
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-none}
    volumes:
      # SQLite 数据持久化（首次启动自动建表 + 种子数据）
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 不对外暴露 3000：只允许 nginx 经内部网络访问，公网扫不到后端
    expose:
      - "3000"

  unified:
    build:
      context: .
      dockerfile: deploy/Dockerfile.unified
    container_name: attendance-unified
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 对外唯一入口。80 被占用时改成 "8080:80" 等任意空闲端口。
      - "${WEB_PORT:-80}:80"
